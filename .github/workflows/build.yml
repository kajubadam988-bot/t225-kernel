name: Build T225 KernelSU-Next kernel

on:
  workflow_dispatch:
    inputs:
      src_asset:
        description: "Source tarball in Release src-v1"
        required: false
        default: "kernel_src.tar.gz"
      ksu_ref:
        description: "legacy | legacy-susfs | legacy-susfs-nomount | legacy-susfs-manual | legacy-susfs-nomount-manual | susfs-*   Suffix @auto (e.g. legacy-susfs-manual@auto) = driver commit auto-matched to the Manager's UAPI; @<commit> = fixed commit"
        default: "legacy-susfs-manual@auto"
      manager_apk_url:
        description: "Direct link to the Manager .apk (optional; empty = latest *spoofed* APK from KernelSU-Next releases, else no APK)"
        default: ""
      bundle_apk:
        description: "true = also put the Manager .apk inside the flashable zip (bigger zip). false (default) = not bundled; the APK is still used at build time for the signature and version"
        default: "false"
      toolchain:
        description: "crdroid11 = original working clang 11.0.1 (default, safe) | neutron = latest Neutron Clang | zyc = latest ZyC Clang | slim = latest Slim LLVM (kernel.org) | llvm = upstream LLVM (see llvm_url)  [all except crdroid11 are experimental]"
        default: "crdroid11"
      llvm_url:
        description: "For neutron/zyc/slim/llvm only. Direct link to a Linux x86_64 .tar.xz / .tar.zst / .tar.gz (empty = auto: newest release of the chosen toolchain; llvm = LLVM 23.1.1 official)"
        default: ""
      features:
        description: "Extra kernel features (space separated): bbr | bbrdef | perf | none  (bbr = BBR+FQ+FQ_CODEL available; bbrdef = also default cc/qdisc; perf = -O2 + BLK_WBT)"
        default: "bbr bbrdef perf"
      iosched:
        description: "I/O scheduler set at boot: deadline (default, same as before) | kyber | bfq  (bfq also turns on the BFQ kernel option automatically)"
        default: "deadline"
      gpu_oc_mhz:
        description: "GPU top-OPP max MHz (stock 680). Empty = GPU OC off. e.g. 750"
        default: "750"
      gpu_oc_volt:
        description: "GPU top-OPP volt (mV x 100, stock 80000). 82500 = 0.825 V"
        default: "82500"
      little_oc_mhz:
        description: "Little cluster (LL, CPU4-7) top-OPP MHz (stock 1800; 1901 = MTK's own SB bin; 2300 = experimental). Empty = off"
        default: "2300"
      zram_max_mb:
        description: "Cap zram size inside the kernel (MB, 512-8192). Android asks for 4096; the kernel clamps it at boot, so no swapoff/reset is needed. Empty = off (stays 4 GB, default now)"
        default: ""
      thermal_hot_c:
        description: "OC thermal watchdog (CPU temp in C, 60-85). The zip installs a KernelSU service.d script: full OC (2501/2300 MHz) below this temp; at/above it a real PPM power budget (1500 mW, 1000 mW from +6 C) caps the CPU, released 10 C lower. The stock 2000 mW thermal budget caps nothing. PPM THERMAL policy stays enabled. Empty = nothing installed (stock thermal behaviour)"
        default: "70"
      ppm_guard:
        description: "on | off  (on = PPM no longer overwrites the governor/Kernel Adiutor min/max, it is only intersected with them; patches cpufreq_v1 mtk_cpufreq_main.c)"
        default: "off"
      runtime_tune:
        description: "on | off  (on = the zip also installs /data/adb/service.d/tune.sh: schedutil up_rate_limit_us 500, top-app schedtune boost 30 (raise only) + prefer_idle 1, vfs_cache_pressure 50, mmcblk0 queue rq_affinity/add_random/iostats; each one skipped if its file is missing; sysfs only, resets on reboot)"
        default: "off"
      zram_lz4_dict:
        description: "on | off  EXPERIMENTAL. on = zram gets the T227U-style modular LZ4 backend plus an opt-in LZ4 dictionary (sysfs comp_dictionary_size / comp_dictionary, set before disksize). No dictionary loaded = plain lz4 as before. Saves RAM, does not make the phone faster"
        default: "off"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK: ${{ github.workspace }}/_work
      OUTDIR: ${{ github.workspace }}/_out
      GH_TOKEN: ${{ github.token }}
      KSU_REF: ${{ inputs.ksu_ref }}
      SRC_ASSET: ${{ inputs.src_asset }}
      APK_URL: ${{ inputs.manager_apk_url }}
      FEATURES: ${{ inputs.features }}
      PPM_GUARD: ${{ inputs.ppm_guard }}
      RUNTIME_TUNE: ${{ inputs.runtime_tune }}
      ZRAM_LZ4_DICT: ${{ inputs.zram_lz4_dict }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      BUNDLE_APK: ${{ inputs.bundle_apk }}
      LLVM_URL: ${{ inputs.llvm_url }}
      IOSCHED: ${{ inputs.iosched }}
      GPU_OC_MHZ: ${{ inputs.gpu_oc_mhz }}
      GPU_OC_VOLT: ${{ inputs.gpu_oc_volt }}
      LITTLE_OC_MHZ: ${{ inputs.little_oc_mhz }}
      ZRAM_MAX_MB: ${{ inputs.zram_max_mb }}
      THERMAL_HOT_C: ${{ inputs.thermal_hot_c }}
    steps:
      - uses: actions/checkout@v4

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download kernel source and build files (Release src-v1)
        run: |
          gh release download src-v1 -R "$GITHUB_REPOSITORY" -p "${SRC_ASSET:-kernel_src.tar.gz}" -p T225_GitHub_Repo_Files.zip
          [ "${SRC_ASSET:-kernel_src.tar.gz}" = kernel_src.tar.gz ] || mv -f "$SRC_ASSET" kernel_src.tar.gz
          unzip -oq T225_GitHub_Repo_Files.zip -x '.github/*'

      # I/O scheduler: patches the boot script in the zip, and adds a 'bfq' feature to
      # 04_extra_features.sh (BFQ is not enabled in the stock T225 defconfig). Kyber is already built in.
      - name: I/O scheduler choice (iosched input)
        run: |
          case "$IOSCHED" in deadline|kyber|bfq) ;; *) echo "::error::iosched must be deadline, kyber or bfq"; exit 1 ;; esac
          python3 - <<'PY'
          p = "scripts/04_extra_features.sh"
          s = open(p).read()
          if "IOSCHED_BFQ" not in s:
              a = "      wireguard) need WIREGUARD ;;\n"
              assert s.count(a) == 1, "verify anchor not found"
              s = s.replace(a, a + "      bfq) need IOSCHED_BFQ; need BFQ_GROUP_IOSCHED ;;\n")
              b = '    *) echo "04: unknown feature'
              assert s.count(b) == 1, "apply anchor not found"
              blk = ("    bfq)\n      need_file block/bfq-iosched.c\n"
                     "      set_y IOSCHED_BFQ; set_y BFQ_GROUP_IOSCHED\n      ;;\n")
              s = s.replace(b, blk + b)
              open(p, "w").write(s)
          PY
          if [ "$IOSCHED" = "bfq" ] && ! echo " $FEATURES " | tr ',' ' ' | grep -q ' bfq '; then
            if [ "$FEATURES" = "none" ]; then NEWF="bfq"; else NEWF="$FEATURES bfq"; fi
            echo "FEATURES=$NEWF" >> "$GITHUB_ENV"
            echo "iosched=bfq -> features: $NEWF"
          fi
          sed -i "s|echo deadline > \"\$q/scheduler\"|echo $IOSCHED > \"\$q/scheduler\"|" ak3_template/ramdisk/sbin/t225-perf-extra.sh
          grep -n 'scheduler' ak3_template/ramdisk/sbin/t225-perf-extra.sh
          grep -q "echo $IOSCHED > " ak3_template/ramdisk/sbin/t225-perf-extra.sh || { echo "::error::scheduler line not patched"; exit 1; }

      # OC thermal watchdog. The stock thermal driver's 2000 mW budget caps nothing (measured), so this puts a KernelSU service.d script
      # in the zip (tools/eem_offset.sh) and appends a block to anykernel.sh that copies it to /data/adb/service.d at flash time.
      # Below thermal_hot_c the script lifts mild stock caps; at/above it forces a real budget (1500 mW, 1000 mW from +6 C) through
      # /proc/ppm/policy/thermal_limit (hottest thermal zone) and releases it 10 C lower. Empty = step skipped = stock behaviour.
      - name: Thermal watchdog (service.d script inside the zip)
        if: inputs.thermal_hot_c != ''
        run: |
          set -e
          case "$THERMAL_HOT_C" in ''|*[!0-9]*) echo "::error::thermal_hot_c must be a number"; exit 1 ;; esac
          [ "$THERMAL_HOT_C" -ge 60 ] && [ "$THERMAL_HOT_C" -le 85 ] || { echo "::error::thermal_hot_c must be 60-85"; exit 1; }
          test -f ak3_template/anykernel.sh || { echo "::error::ak3_template/anykernel.sh not found"; exit 1; }
          mkdir -p ak3_template/tools
          cat > ak3_template/tools/eem_offset.sh <<'EEMEOF'
          #!/system/bin/sh
          # T225 OC thermal watchdog (KernelSU service.d). Installed by the kernel zip.
          # 1 step of EEM offset = 6.25 mV, positive = higher voltage (0 = stock, works at 2501/2300 MHz).
          OFFSET_L=0    # cpu0-3 (EEM_DET_L)
          OFFSET_2L=0   # cpu4-7 (EEM_DET_2L)
          HOT=70000     # millidegrees C: at/above this a real power cap (CAP1_MW) is forced
          COOL=60000    # millidegrees C: at/below this the forced cap is released again
          CAP1_MW=1500  # measured: THERMAL policy max OPP idx 3 (cpu0-3 2074 MHz, cpu4-7 1491 MHz)
          CAP2_MW=1000  # measured: idx 6 (1879 / 1226 MHz), used from HOT + 6 C
          HOT2=$((HOT + 6000))
          LOG=/data/local/tmp/eem_wd.log
          PPM=/proc/ppm

          # Measured on the tablet (4 busy loops): budget >= 1900 mW caps nothing, 1800/1700 -> idx 1,
          # 1600 -> 2, 1500..1300 -> 3, 1200 -> 4, 1100 -> 5, 1000 -> 6, 800 -> 9. The stock thermal driver's
          # 2000 mW budget therefore protects very little. The PPM THERMAL policy stays ENABLED here.
          # Below HOT: a mild stock cap (>= max power - 100 mW) is lifted by writing budget 0 to
          # /proc/ppm/policy/thermal_limit. At/above HOT: CAP1_MW (CAP2_MW from HOT2) is forced and
          # re-forced whenever the driver replaces it with something weaker. Released at COOL.

          log() {
            echo "$(date) $*" >> $LOG
            [ "$(wc -c < $LOG 2>/dev/null)" -gt 100000 ] && echo "$(date) log reset" > $LOG
          }

          max_temp() {
            T=0
            for z in /sys/class/thermal/thermal_zone*/temp; do
              v=$(cat $z 2>/dev/null)
              case "$v" in ''|*[!0-9]*) continue ;; esac
              [ "$v" -gt "$T" ] && T=$v
            done
            echo $T
          }

          thermal_is_off() {
            grep PPM_POLICY_THERMAL $PPM/policy_status 2>/dev/null | grep -qi disabled
          }

          get_limit() {
            N=$(sed -n 's/^limited power = //p' $PPM/policy/thermal_limit 2>/dev/null)
            A=$(sed -n 's/^PPM thermal activate = //p' $PPM/policy/thermal_limit 2>/dev/null)
            MAXP=$(sed -n 's/^max power = //p' $PPM/policy/thermal_cur_power 2>/dev/null)
            [ -n "$N" ] || N=0
            [ -n "$A" ] || A=0
            [ -n "$MAXP" ] || MAXP=2020
          }

          wd_step() {
            T=$(max_temp)
            if thermal_is_off; then
              echo 4 1 > $PPM/policy_status
              log "policy was off -> enabled"
            fi
            if [ "$T" -ge "$HOT" ]; then STATE=hot
            elif [ "$T" -le "$COOL" ]; then STATE=cool
            fi
            get_limit
            if [ "$STATE" = "cool" ]; then
              if [ "$A" = "1" ] && { [ "$N" -ge $((MAXP - 100)) ] || [ "$N" -eq "$CAP1_MW" ] || [ "$N" -eq "$CAP2_MW" ]; }; then
                echo 0 > $PPM/policy/thermal_limit
                log "cool $T mC: cap ($N mW) released"
              fi
            else
              WANT=$CAP1_MW
              [ "$T" -ge "$HOT2" ] && WANT=$CAP2_MW
              if [ "$A" != "1" ] || [ "$N" -gt "$WANT" ]; then
                echo $WANT > $PPM/policy/thermal_limit
                log "HOT $T mC: cap $WANT mW forced"
              fi
            fi
          }

          start_watchdog() {
            while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 5; done
            sleep 30

            echo $OFFSET_L > /proc/eem/EEM_DET_L/eem_offset
            echo $OFFSET_2L > /proc/eem/EEM_DET_2L/eem_offset

            # PPM THERMAL is idx 4 in policy_status (it is [5] in dump_policy_list); keep it enabled
            echo 4 1 > $PPM/policy_status
            echo "$(date) boot: full OC below $((HOT / 1000)) C, power cap $CAP1_MW mW above ($CAP2_MW mW from $((HOT2 / 1000)) C)" > $LOG

            (
              STATE=cool
              while true; do
                wd_step
                sleep 3
              done
            ) &
          }

          [ "$WD_LIB" = "1" ] || start_watchdog
          EEMEOF
          sed -i "s/^HOT=[0-9]*/HOT=$(( THERMAL_HOT_C * 1000 ))/; s/^COOL=[0-9]*/COOL=$(( (THERMAL_HOT_C - 10) * 1000 ))/" ak3_template/tools/eem_offset.sh
          chmod 755 ak3_template/tools/eem_offset.sh
          sh -n ak3_template/tools/eem_offset.sh
          grep -n '^HOT=\|^COOL=' ak3_template/tools/eem_offset.sh
          if ! grep -q "T225 thermal watchdog" ak3_template/anykernel.sh; then
            echo >> ak3_template/anykernel.sh
            cat >> ak3_template/anykernel.sh <<'AKEOF'
          ui_print " ";
          ui_print "=== T225 thermal watchdog (OC) ===";
          mount /data 2>/dev/null;
          SVC=/data/adb/service.d;
          if [ -d /data/adb ]; then
            mkdir -p "$SVC" 2>/dev/null;
            cp -f "$AKHOME/tools/eem_offset.sh" "$SVC/eem_offset.sh" 2>/dev/null;
            if [ -s "$SVC/eem_offset.sh" ]; then
              chmod 755 "$SVC/eem_offset.sh" 2>/dev/null;
              restorecon "$SVC/eem_offset.sh" 2>/dev/null;
              ui_print "Installed $SVC/eem_offset.sh";
              ui_print "Full OC below __HOT__ C, real power cap above";
              ui_print "Log: /data/local/tmp/eem_wd.log";
            else
              ui_print "Copy FAILED. Install tools/eem_offset.sh by hand";
              ui_print "into /data/adb/service.d/ (chmod 755).";
            fi;
          else
            ui_print "/data/adb not accessible (encrypted?), not installed.";
            ui_print "Copy tools/eem_offset.sh from the zip to";
            ui_print "/data/adb/service.d/ by hand (chmod 755).";
          fi;
          ui_print "=================================";
          AKEOF
            sed -i "s/__HOT__/$THERMAL_HOT_C/" ak3_template/anykernel.sh
          fi
          sh -n ak3_template/anykernel.sh
          tail -n 24 ak3_template/anykernel.sh

      # Optional runtime tuning script (KernelSU service.d), same install method as the thermal watchdog. Off by default.
      - name: Runtime tune (service.d script inside the zip)
        if: ${{ inputs.runtime_tune == 'on' }}
        run: |
          set -e
          test -f ak3_template/anykernel.sh || { echo "::error::ak3_template/anykernel.sh not found"; exit 1; }
          mkdir -p ak3_template/tools
          cat > ak3_template/tools/tune.sh <<'TUNEEOF'
          #!/system/bin/sh
          # T225 runtime tuning (KernelSU service.d). Safe: every setting is optional,
          # skipped if its sysfs file is missing, and logged as "old -> new".
          # Nothing is permanent: sysfs values reset on reboot. To remove: rm this file, reboot.
          # An empty value below = that setting is skipped.
          UP_RATE_US=500        # schedutil: how often frequency may RISE (smaller = snappier)
          # DOWN_RATE_US is left alone on purpose (keeps frequency from dropping too fast/slow)
          STUNE_BOOST=30        # /dev/stune/top-app/schedtune.boost, only RAISED to this value, never lowered
          PREFER_IDLE=1         # /dev/stune/top-app/schedtune.prefer_idle: foreground threads go to idle CPUs first
          VFS_PRESSURE=50       # vm.vfs_cache_pressure (default 100): keep dentry/inode cache longer
          RQ_AFFINITY=2         # mmcblk0 queue: complete I/O on the submitting CPU
          ADD_RANDOM=0          # mmcblk0 queue: do not feed the entropy pool from disk I/O
          IOSTATS=0             # mmcblk0 queue: no per-request I/O accounting (less overhead)
          ROOT=${TUNE_ROOT:-}   # only for testing; empty on the phone
          LOG=${TUNE_LOG:-/data/local/tmp/tune.log}

          log() { echo "$(date) $*" >> "$LOG"; }

          setv() {  # setv <file> <value>
            f="$1"; v="$2"
            [ -w "$f" ] || { log "skip (not writable): $f"; return 1; }
            old=$(cat "$f" 2>/dev/null)
            if [ "$old" = "$v" ]; then log "unchanged $f = $v"; return 0; fi
            if echo "$v" > "$f" 2>/dev/null; then
              new=$(cat "$f" 2>/dev/null)
              log "$f: $old -> $new"
            else
              log "FAILED write $v to $f (was $old)"
            fi
          }

          raisev() {  # raisev <file> <minimum>: write only if the current number is lower
            f="$1"; m="$2"
            [ -w "$f" ] || { log "skip (not writable): $f"; return 1; }
            cur=$(cat "$f" 2>/dev/null)
            case "$cur" in ''|*[!0-9-]*) log "skip (not a number: '$cur'): $f"; return 1 ;; esac
            if [ "$cur" -ge "$m" ]; then log "unchanged $f = $cur (already >= $m)"; return 0; fi
            setv "$f" "$m"
          }

          run() {
            if [ -z "$TUNE_NOWAIT" ]; then
              while [ "$(getprop sys.boot_completed)" != "1" ]; do sleep 5; done
              sleep 45   # after eem_offset.sh and the boot rush
            fi
            echo "$(date) tune start" > "$LOG"

            # schedutil rate limit. T225 kernel: tunables are GLOBAL in
            #    /sys/devices/system/cpu/cpufreq/schedutil/ (not per policy).
            USING=0
            for p in $ROOT/sys/devices/system/cpu/cpufreq/policy*; do
              [ "$(cat $p/scaling_governor 2>/dev/null)" = "schedutil" ] && USING=1
            done
            G=$ROOT/sys/devices/system/cpu/cpufreq/schedutil
            if [ -n "$UP_RATE_US" ]; then
              if [ "$USING" = "1" ] && [ -e "$G/up_rate_limit_us" ]; then
                setv "$G/up_rate_limit_us" "$UP_RATE_US"
              else
                log "schedutil not active or no up_rate_limit_us, no rate-limit change"
              fi
            fi

            # top-app boost (schedtune): helps the foreground app's threads get bigger/faster CPUs.
            if [ -n "$STUNE_BOOST" ]; then
              B=$ROOT/dev/stune/top-app/schedtune.boost
              if [ -e "$B" ]; then raisev "$B" "$STUNE_BOOST"; else log "no schedtune top-app boost file here, skipped"; fi
            fi
            if [ -n "$PREFER_IDLE" ]; then
              PI=$ROOT/dev/stune/top-app/schedtune.prefer_idle
              if [ -e "$PI" ]; then setv "$PI" "$PREFER_IDLE"; else log "no schedtune top-app prefer_idle file here, skipped"; fi
            fi

            # page-cache / dentry pressure
            [ -n "$VFS_PRESSURE" ] && setv "$ROOT/proc/sys/vm/vfs_cache_pressure" "$VFS_PRESSURE"

            # eMMC queue
            Q=$ROOT/sys/block/mmcblk0/queue
            if [ -d "$Q" ]; then
              [ -n "$RQ_AFFINITY" ] && setv "$Q/rq_affinity" "$RQ_AFFINITY"
              [ -n "$ADD_RANDOM" ] && setv "$Q/add_random" "$ADD_RANDOM"
              [ -n "$IOSTATS" ] && setv "$Q/iostats" "$IOSTATS"
            else
              log "no mmcblk0 queue dir, I/O settings skipped"
            fi

            # diagnostics only (nothing is written): what boost interfaces exist here
            log "info perfmgr: $(ls $ROOT/proc/perfmgr 2>/dev/null | tr '\n' ' ')"
            log "info stune groups: $(ls $ROOT/dev/stune 2>/dev/null | tr '\n' ' ')"
            log "tune done"
          }

          ( run ) &
          TUNEEOF
          chmod 755 ak3_template/tools/tune.sh
          sh -n ak3_template/tools/tune.sh
          if ! grep -q "T225 runtime tune" ak3_template/anykernel.sh; then
            echo >> ak3_template/anykernel.sh
            cat >> ak3_template/anykernel.sh <<'AKEOF'
          ui_print " ";
          ui_print "=== T225 runtime tune ===";
          mount /data 2>/dev/null;
          if [ -d /data/adb ]; then
            mkdir -p /data/adb/service.d 2>/dev/null;
            cp -f "$AKHOME/tools/tune.sh" /data/adb/service.d/tune.sh 2>/dev/null;
            if [ -s /data/adb/service.d/tune.sh ]; then
              chmod 755 /data/adb/service.d/tune.sh 2>/dev/null;
              restorecon /data/adb/service.d/tune.sh 2>/dev/null;
              ui_print "Installed /data/adb/service.d/tune.sh";
              ui_print "Log: /data/local/tmp/tune.log";
            else
              ui_print "Copy FAILED. Install tools/tune.sh by hand";
            fi;
          else
            ui_print "/data/adb not accessible, tune.sh not installed.";
          fi;
          ui_print "=========================";
          AKEOF
          fi
          sh -n ak3_template/anykernel.sh
          tail -n 22 ak3_template/anykernel.sh

      # Experimental: other clang instead of the crDroid clang 11.0.1.
      # It is unpacked to $WORK/toolchain_611, so 01_setup.sh skips its own git clone and
      # 02_build.sh picks it up unchanged. Extra -Wno flags are added because a new clang is
      # much stricter than clang 11 on this old 4.19 vendor code. Default (crdroid11) is untouched.
      - name: Install experimental toolchain (neutron | zyc | slim | llvm)
        if: inputs.toolchain != 'crdroid11'
        run: |
          URL="$LLVM_URL"
          if [ -z "$URL" ]; then
            case "$TOOLCHAIN" in
              neutron)
                # newest Neutron Clang build (asset neutron-clang-<date>.tar.zst)
                URL=$(gh api repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
                  --jq '[.assets[] | select(.name | test("^neutron-clang-.*\\.tar\\.zst$"))][0].browser_download_url // empty') ;;
              zyc)
                # ZyC publishes several clang lines (14.0.6, 16.0.6, 21.0.0git ...), and "releases/latest"
                # returns whichever line was uploaded LAST -> random version. So pick the highest
                # version line, newest date inside it (asset Clang-<ver>-<date>.tar.gz, ~570 MB).
                URL=$(gh api "repos/ZyCromerZ/Clang/releases?per_page=100" \
                  --jq '.[] | select(.prerelease==false) | .assets[] | select(.name | test("^Clang-.*\\.tar\\.(gz|xz|zst)$")) | "\(.name) \(.browser_download_url)"' \
                  | python3 -c '
          import re, sys
          best = None
          for l in sys.stdin:
              n, u = l.split()
              m = re.match(r"Clang-(.+)-(\d{8})\.tar", n)
              if not m: continue
              ver = tuple(int(x) for x in re.findall(r"\d+", m.group(1))[:3])
              key = (ver, int(m.group(2)))
              if best is None or key > best[0]: best = (key, u)
          print(best[1] if best else "")
          ') ;;
              slim)
                # newest stable (non -rc) Slim LLVM from kernel.org
                BASE="https://mirrors.edge.kernel.org/pub/tools/llvm/files"
                F=$(curl -fsSL --retry 3 "$BASE/" | grep -oE 'llvm-[0-9]+\.[0-9]+\.[0-9]+-x86_64\.tar\.xz' | sort -uV | tail -1)
                [ -n "$F" ] && URL="$BASE/$F" ;;
              *)
                URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz" ;;
            esac
            [ -z "$URL" ] && { echo "::error::could not resolve the $TOOLCHAIN toolchain download"; exit 1; }
          fi
          echo "Toolchain ($TOOLCHAIN): $URL"
          sudo apt-get install -y zstd >/dev/null 2>&1 || true
          mkdir -p _llvm "$WORK"
          curl -fL --retry 3 -o _llvm/tc.archive "$URL"
          case "$URL" in
            *.zst) tar -C _llvm --zstd -xf _llvm/tc.archive ;;
            *.gz)  tar -C _llvm -xzf _llvm/tc.archive ;;
            *)     tar -C _llvm -xf _llvm/tc.archive ;;
          esac
          rm -f _llvm/tc.archive
          # bin/clang is a symlink (-> clang-23) in the official tarball, so accept files AND symlinks
          CLANG=$(find _llvm \( -type f -o -type l \) -path '*/bin/clang' | head -1)
          if [ -z "$CLANG" ]; then
            echo "::error::bin/clang not found in the archive. Top-level content:"
            ls -la _llvm | head -20
            exit 1
          fi
          rm -rf "$WORK/toolchain_611"
          mv "$(dirname "$(dirname "$CLANG")")" "$WORK/toolchain_611"
          rm -rf _llvm
          "$WORK/toolchain_611/bin/clang" --version | head -1
          python3 - <<'PY'
          p = "scripts/02_build.sh"
          s = open(p).read()
          flags = ('KCFLAGS="-w -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion '
                   '-Wno-incompatible-function-pointer-types -Wno-incompatible-pointer-types -Wno-implicit-int '
                   '-Wno-deprecated-non-prototype -Wno-strict-prototypes"')
          assert "KCFLAGS=-w" in s
          open(p, "w").write(s.replace("KCFLAGS=-w", flags, 1))
          PY
          grep -n "KCFLAGS" scripts/02_build.sh

      # Manager APK: the given link, or the newest *spoofed* release APK of KernelSU-Next.
      # The driver is NOT affected: it always comes from KSU_REF. The APK's signing cert is
      # added to the driver's accepted managers (KSU_EXTRA_CERTS) so a newer Manager is accepted.
      - name: Fetch Manager APK (latest spoofed unless a link is given)
        run: |
          mkdir -p _apk
          URL="$APK_URL"
          if [ -z "$URL" ]; then
            URL=$(gh api "repos/KernelSU-Next/KernelSU-Next/releases?per_page=10" \
              --jq '[.[].assets[] | select(.name | test("spoofed.*release\\.apk$"))][0].browser_download_url // empty' || true)
          fi
          if [ -n "$URL" ] && curl -fsSL -o _apk/manager.apk "$URL" && [ -s _apk/manager.apk ]; then
            echo "Manager APK: $URL"
            CERT=$(python3 -I scripts/apk_cert_info.py --extra _apk/manager.apk)
            echo "Manager cert: $CERT"
            echo "KSU_EXTRA_CERTS=$CERT" >> "$GITHUB_ENV"
            # Driver reports the same version as the Manager (e.g. v3.4.2 / 33355) instead of the
            # branch's own tag/commit count (v3.4.0-legacy / 33313). Read from the APK file name.
            NAME=$(basename "${URL%%\?*}")
            if [[ "$NAME" =~ _v([0-9]+\.[0-9]+\.[0-9]+)[^_]*_([0-9]+)-release\.apk$ ]]; then
              echo "KSU_VERSION_TAG_OVERRIDE=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
              echo "KSU_VERSION_OVERRIDE=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
              echo "Driver version will be pinned to v${BASH_REMATCH[1]} (${BASH_REMATCH[2]})"
            else
              echo "::warning::Could not read version from APK name '$NAME'; driver keeps its own version"
            fi
          else
            rm -f _apk/manager.apk
            echo "::warning::No Manager APK fetched; the zip is built without it"
          fi

      # ksu_ref ends with "@auto" (e.g. legacy-susfs-manual@auto): pick the newest legacy driver commit
      # whose KERNEL_SU_UAPI_VERSION equals the one the Manager expects. The Manager's UAPI is read from
      # uapi/supercall.h at the Manager's release tag (tag taken from the APK file name, else the newest
      # stable tag). Result is written back into KSU_REF as "<ref>@<commit>", so 01_setup.sh is unchanged.
      # Any problem -> warning and plain branch HEAD (same as writing the ref without "@").
      - name: Auto-pick KernelSU-Next driver commit (match Manager UAPI)
        if: endsWith(inputs.ksu_ref, '@auto')
        run: |
          BASE="${KSU_REF%@auto}"
          case "$BASE" in
            legacy*) ;;
            *) echo "::warning::@auto only supports legacy* refs; using '$BASE' as is"; echo "KSU_REF=$BASE" >> "$GITHUB_ENV"; exit 0 ;;
          esac
          cat > "$RUNNER_TEMP/pick.sh" <<'EOS'
          #!/usr/bin/env bash
          set -uo pipefail
          REPO=https://github.com/KernelSU-Next/KernelSU-Next.git
          TAG="${1:-}"; BRANCH=legacy; HDR=uapi/supercall.h
          D="$(mktemp -d)"
          uapi_at() { git -C "$D" show "$1:$HDR" 2>/dev/null | sed -nE 's/^[^\/]*KERNEL_SU_UAPI_VERSION[[:space:]]*=?[[:space:]]*([0-9]+).*/\1/p' | head -1; }
          if [ -z "$TAG" ]; then
            TAG="$(git ls-remote --tags --refs "$REPO" 'v[0-9]*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
            echo "No APK tag known; newest stable tag: $TAG"
          fi
          [ -n "$TAG" ] || { echo "no tag"; exit 1; }
          git clone --quiet --filter=blob:none --no-checkout "$REPO" "$D" || exit 1
          git -C "$D" rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "tag $TAG not found"; exit 1; }
          TARGET="$(uapi_at "refs/tags/$TAG")"; [ -n "$TARGET" ] || { echo "cannot read UAPI of $TAG"; exit 1; }
          echo "Manager $TAG expects UAPI = $TARGET"
          HEADSHA="$(git -C "$D" rev-parse "origin/$BRANCH")"
          mapfile -t T < <(git -C "$D" log --format=%H "origin/$BRANCH" -- "$HDR")
          PIN=""
          for i in "${!T[@]}"; do
            [ "$(uapi_at "${T[$i]}")" = "$TARGET" ] || continue
            if [ "$i" -eq 0 ]; then PIN="$HEADSHA"; else PIN="$(git -C "$D" rev-parse "${T[$((i-1))]}^")"; fi
            break
          done
          [ -n "$PIN" ] || { echo "no $BRANCH commit with UAPI $TARGET"; exit 3; }
          echo "Chosen driver commit ${PIN:0:8} (driver UAPI $(uapi_at "$PIN"), manager UAPI $TARGET)"
          echo "PIN=${PIN:0:8}" > "$RUNNER_TEMP/pin.txt"
          EOS
          rm -f "$RUNNER_TEMP/pin.txt"
          if bash "$RUNNER_TEMP/pick.sh" "${KSU_VERSION_TAG_OVERRIDE:-}" && [ -s "$RUNNER_TEMP/pin.txt" ]; then
            . "$RUNNER_TEMP/pin.txt"
            echo "KSU_REF=${BASE}@${PIN}" >> "$GITHUB_ENV"
            echo "KSU_REF -> ${BASE}@${PIN}"
          else
            echo "::warning::Auto-pick failed; driver = newest commit of the branch (Manager/driver UAPI may differ)"
            echo "KSU_REF=$BASE" >> "$GITHUB_ENV"
          fi

      - name: Setup (deps, toolchain, source, KernelSU-Next)
        run: bash scripts/01_setup.sh "$KSU_REF"


          +++ b/drivers/block/zram/backend_lz4.c	2026-11-21 09:26:06.016642684 +0530
          @@ -0,0 +1,85 @@
          +// SPDX-License-Identifier: GPL-2.0-only
          +#include <linux/errno.h>

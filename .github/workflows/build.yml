name: Build T225 KernelSU-Next kernel

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "legacy | legacy-susfs | legacy-susfs-nomount | legacy-susfs-manual | legacy-susfs-nomount-manual | susfs-*"
        default: "legacy-susfs-manual"
      features:
        description: "Extra kernel features: bbr | bbr wireguard | none  (bbr = BBR+FQ+FQ_CODEL)"
        default: "bbr"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK: ${{ github.workspace }}/_work
      OUTDIR: ${{ github.workspace }}/_out
      GH_TOKEN: ${{ github.token }}
      KSU_REF: ${{ inputs.ksu_ref }}
      FEATURES: ${{ inputs.features }}
    steps:
      - uses: actions/checkout@v4

      - name: Download kernel source and build files (Release src-v1)
        run: |
          gh release download src-v1 -R "$GITHUB_REPOSITORY" -p kernel_src.tar.gz -p T225_GitHub_Repo_Files.zip
          unzip -oq T225_GitHub_Repo_Files.zip -x '.github/*'

      - name: Setup (deps, toolchain, source, KernelSU-Next)
        run: bash scripts/01_setup.sh "$KSU_REF"

      - name: Build kernel
        run: |
          bash scripts/02_build.sh
          tail -n 3 "$WORK/build.log"
          grep -q 'BUILD_EXIT=0' "$WORK/build.log"

      - name: Show KernelSU-Next driver version
        run: |
          cd "$WORK/src/KernelSU"
          echo "Driver branch/ref: $KSU_REF  commit: $(git rev-parse --short HEAD)  describe: $(git describe --tags 2>/dev/null)"
          grep -rn "KERNEL_SU_UAPI_VERSION" uapi/supercall.h kernel/uapi/supercall.h 2>/dev/null | head -2 || true

      - name: Verify extra features are in the final .config
        run: bash scripts/04_extra_features.sh verify "$WORK/src" "${FEATURES:-bbr}"

      - name: Show errors if build failed
        if: failure()
        run: grep -n "error:\|Error " "$WORK/build.log" | head -40 || true

      - name: Package flashable zip
        run: bash scripts/03_package.sh

      - name: Publish Release
        run: |
          ZIP=$(ls "$OUTDIR"/*.zip)
          gh release create "build-${{ github.run_number }}" "$ZIP" \
            --title "T225 build #${{ github.run_number }} (KernelSU-Next: $KSU_REF)" \
            --notes "Auto-built flashable zip. Check after flashing: boots, WiFi/Bluetooth, overclock."

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: _work/build.log
          

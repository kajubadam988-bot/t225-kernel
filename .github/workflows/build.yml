      # GPU overclock: SM-T225 uses the MT6765 "segment 3" GPU table (680/500/400 MHz).
      # Only the top row is changed (680 MHz -> gpu_oc_mhz, 0.800 V -> gpu_oc_volt).
      # VSRAM stays 0.875 V. gpu_oc_mhz empty = step skipped = stock GPU.
      - name: GPU overclock (MT6765 segment 3 top OPP)
        if: inputs.gpu_oc_mhz != ''
        run: |
          set -e
          H="$WORK/src/drivers/gpu/mediatek/gpufreq/mt6765/mtk_gpufreq_core.h"
          test -f "$H" || { echo "::error::mt6765 gpufreq header not found"; exit 1; }
          sed -i -E "s/^(#define SEG3_GPU_DVFS_FREQ0[[:space:]]+)\(680000\)/\1(${GPU_OC_MHZ}000)/" "$H"
          sed -i -E "s/^(#define SEG3_GPU_DVFS_VOLT0[[:space:]]+)\(80000\)/\1(${GPU_OC_VOLT})/" "$H"
          grep -n "SEG3_GPU_DVFS_FREQ0\|SEG3_GPU_DVFS_VOLT0\|SEG3_GPU_DVFS_VSRAM0" "$H"
          grep -q "SEG3_GPU_DVFS_FREQ0[[:space:]]*(${GPU_OC_MHZ}000)" "$H" || { echo "::error::GPU freq not patched"; exit 1; }
          grep -q "SEG3_GPU_DVFS_VOLT0[[:space:]]*(${GPU_OC_VOLT})" "$H" || { echo "::error::GPU volt not patched"; exit 1; }

      # Little cluster (LL) overclock. The kernel picks the OPP table from an efuse value at boot:
      # C65T (efuse 0x2/0x5) or C65 (0x3/0x4 and the default for unknown values) - both have LL top = 1800.
      # The T225 reports an LL top of 1800 and could be either one, so BOTH tables are patched
      # (the unused one is harmless). Only the top row of LL changes (1800 -> little_oc_mhz); voltage
      # index stays 96. 1901 MHz is MTK's own qualified bin (SB table); 2300 is experimental.
      - name: Little cluster overclock (LL top OPP, C65T + C65)
        if: inputs.little_oc_mhz != ''
        run: |
          set -e
          D="$WORK/src/drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6765"
          T="$D/mtk_cpufreq_opp_table.h"
          P="$D/mtk_cpufreq_opp_pv_table.h"
          test -f "$T" && test -f "$P" || { echo "::error::mt6765 cpufreq tables not found"; exit 1; }
          for V in C65T C65; do
            sed -i -E "s/^(#define CPU_DVFS_FREQ0_LL_${V}[[:space:]]+)1800000/\1${LITTLE_OC_MHZ}000/" "$T"
            grep -q "^#define CPU_DVFS_FREQ0_LL_${V}[[:space:]]*${LITTLE_OC_MHZ}000" "$T" || { echo "::error::LL opp table $V not patched"; exit 1; }
          done
          for TBL in c65tTbl c65Tbl; do
            sed -i -E "/static unsigned int ${TBL}\[/,/^};/ s/\{ 1800, 96, 1, 1 \}/{ ${LITTLE_OC_MHZ}, 96, 1, 1 }/" "$P"
            awk -v t="static unsigned int ${TBL}[" 'index($0,t){f=1} f&&/\/\* LL \*\//{print; exit}' "$P" | grep -q "{ ${LITTLE_OC_MHZ}, 96, 1, 1 }" || { echo "::error::LL pv table $TBL not patched"; exit 1; }
          done
          grep -n "CPU_DVFS_FREQ0_LL_C65" "$T"

      # zram size cap: Android (fstab zramsize) writes 4 GB to /sys/block/zram0/disksize at boot.
      # The kernel clamps that single write to zram_max_mb, so zram is small from the very first
      # moment: no swapoff / reset / retry loop in userspace (that caused slowdowns and bootloops
      # when tried from a module). The compressor stays the kernel default (lz4). Empty = off.
      - name: zram size cap (kernel clamps disksize)
        if: inputs.zram_max_mb != ''
        run: |
          set -e
          case "$ZRAM_MAX_MB" in ''|*[!0-9]*) echo "::error::zram_max_mb must be a number"; exit 1 ;; esac
          [ "$ZRAM_MAX_MB" -ge 512 ] && [ "$ZRAM_MAX_MB" -le 8192 ] || { echo "::error::zram_max_mb must be 512-8192"; exit 1; }
          F="$WORK/src/drivers/block/zram/zram_drv.c"
          test -f "$F" || { echo "::error::zram_drv.c not found"; exit 1; }
          python3 - "$F" "$ZRAM_MAX_MB" <<'PY'
          import sys
          p, mb = sys.argv[1], int(sys.argv[2])
          s = open(p).read()
          a = "\tdisksize = memparse(buf, NULL);\n\tif (!disksize)\n\t\treturn -EINVAL;\n"
          assert s.count(a) == 1, "disksize anchor not found exactly once"
          ins = ("\n\t/* T225: cap zram size (set at build time) */\n"
                 "\tif (disksize > ((u64)%d << 20)) {\n"
                 "\t\tpr_info(\"zram: disksize %%llu MB capped to %d MB\\n\",\n"
                 "\t\t\t(unsigned long long)(disksize >> 20));\n"
                 "\t\tdisksize = (u64)%d << 20;\n"
                 "\t}\n") % (mb, mb, mb)
          open(p, "w").write(s.replace(a, a + ins, 1))
          PY
          grep -n -B1 -A6 "T225: cap zram" "$F"

      # T225 USB HID: skip Samsung's hardcoded hid_data "HACK" block in f_hid.c
      # when configfs report_desc is set (patch_fhid.py is in the repo root).
      - name: Patch f_hid.c (USB HID gadget)
        run: |
          set -e
          F="$WORK/src/drivers/usb/gadget/function/f_hid.c"
          test -f "$F" || { echo "::error::f_hid.c not found"; exit 1; }
          python3 "$GITHUB_WORKSPACE/patch_fhid.py" "$F"
          grep -q "t225_skip_hack" "$F" || { echo "::error::f_hid.c patch did not apply"; exit 1; }
          grep -n -B2 -A2 "t225_skip_hack" "$F"

      # Optional: PPM policy guard (idea from senposage/T227U-KernelSU-Next). Off by default.
      - name: Patch cpufreq (PPM policy guard)
        if: ${{ inputs.ppm_guard == 'on' }}
        run: |
          set -e
          cat > "$RUNNER_TEMP/patch_ppmguard.py" <<'PYEOF'
          #!/usr/bin/env python3
          """T225 PPM policy guard (same idea as senposage/T227U-KernelSU-Next).

          Stock MTK code overwrites cpufreq policy->min/max with the PPM limits whenever
          PPM changes. This patch keeps the governor / Kernel Adiutor selection
          (policy->user_policy.min/max) and only INTERSECTS it with the PPM limits:
            max = min(user_max, ppm_max)   min = max(user_min, ppm_min)
          PPM thermal/power caps still win, because they only ever lower max.

          usage: patch_ppmguard.py <mtk_cpufreq_main.c> [more files...]
          exit 0 = patched or already patched, exit 1 = stock block not found.
          """
          import re, sys

          MARK = "T225 ppm guard"

          PAT = re.compile(
              r"(?P<ind>[ \t]*)if \(pp->idx_opp_ppm_limit == -1\)\s*"
              r"pp->mt_policy->max =\s*cpu_dvfs_get_max_freq\(pp\);\s*"
              r"else\s*pp->mt_policy->max =\s*"
              r"cpu_dvfs_get_freq_by_idx\(pp,\s*pp->idx_opp_ppm_limit\);\s*"
              r"if \(pp->idx_opp_ppm_base == -1\)\s*"
              r"pp->mt_policy->min =\s*cpu_dvfs_get_min_freq\(pp\);\s*"
              r"else\s*pp->mt_policy->min =\s*"
              r"cpu_dvfs_get_freq_by_idx\(pp,\s*pp->idx_opp_ppm_base\);"
          )

          NEW = """{ind}{{ /* {mark}: PPM is a safety envelope, keep the user selection */
          {ind}\tunsigned int ppm_max, ppm_min, user_max, user_min;

          {ind}\tif (pp->idx_opp_ppm_limit == -1)
          {ind}\t\tppm_max = cpu_dvfs_get_max_freq(pp);
          {ind}\telse
          {ind}\t\tppm_max = cpu_dvfs_get_freq_by_idx(pp,
          {ind}\t\t\tpp->idx_opp_ppm_limit);
          {ind}\tif (pp->idx_opp_ppm_base == -1)
          {ind}\t\tppm_min = cpu_dvfs_get_min_freq(pp);
          {ind}\telse
          {ind}\t\tppm_min = cpu_dvfs_get_freq_by_idx(pp,
          {ind}\t\t\tpp->idx_opp_ppm_base);

          {ind}\tuser_max = pp->mt_policy->user_policy.max;
          {ind}\tuser_min = pp->mt_policy->user_policy.min;
          {ind}\tpp->mt_policy->max = min(user_max, ppm_max);
          {ind}\tpp->mt_policy->min = max(user_min, ppm_min);
          {ind}\tif (pp->mt_policy->min > pp->mt_policy->max)
          {ind}\t\tpp->mt_policy->min = pp->mt_policy->max;
          {ind}}}"""

          def patch(path):
              s = open(path, encoding="utf-8", errors="surrogateescape").read()
              if MARK in s or "user_policy.max" in s:
                  print(f"{path}: already patched, skipped")
                  return True
              m = PAT.search(s)
              if not m:
                  print(f"{path}: stock MT_CPU_DVFS_PPM block not found")
                  return False
              new = NEW.format(ind=m.group("ind"), mark=MARK)
              s = s[:m.start()] + new + s[m.end():]
              open(path, "w", encoding="utf-8", errors="surrogateescape").write(s)
              print(f"{path}: patched")
              return True

          if __name__ == "__main__":
              ok = all([patch(p) for p in sys.argv[1:]]) if len(sys.argv) > 1 else False
              sys.exit(0 if ok else 1)
          PYEOF
          D="$WORK/src/drivers/misc/mediatek/base/power/cpufreq_v1/src"
          OK=0
          for F in "$D/mtk_cpufreq_main.c" "$D/v2/mtk_cpufreq_main.c"; do
            [ -f "$F" ] || continue
            if python3 "$RUNNER_TEMP/patch_ppmguard.py" "$F"; then OK=1; fi
          done
          [ "$OK" = 1 ] || { echo "::error::PPM guard: stock block not found in any cpufreq_v1 main.c"; exit 1; }
          grep -rn "T225 ppm guard" "$D" | head

      - name: Build kernel
        run: |
          bash scripts/02_build.sh
          tail -n 3 "$WORK/build.log"
          grep -q 'BUILD_EXIT=0' "$WORK/build.log"

      # zram LZ4 dictionary: the new backend must really be part of the kernel (needs CONFIG_CRYPTO_LZ4=y).
      - name: Check zram LZ4 dictionary backend was built
        if: ${{ inputs.zram_lz4_dict == 'on' }}
        run: |
          cd "$WORK/src"
          grep -E '^(# )?CONFIG_(CRYPTO_LZ4|ZRAM)[= ]' out/.config || true
          grep -q '^CONFIG_CRYPTO_LZ4=y' out/.config || { echo "::error::CONFIG_CRYPTO_LZ4 is not =y, the dictionary backend is not built"; exit 1; }
          test -f out/drivers/block/zram/backend_lz4.o || { echo "::error::backend_lz4.o was not built"; exit 1; }
          echo "zram LZ4 dictionary backend OK"

      # Right after the build: show which compiler/config was used and check the export-table
      # format. The WiFi/BT CRC patch in the packaging step needs 8-byte __ksymtab entries (one 4-byte
      # __kcrctab entry each). Some toolchains/options produce 16-byte entries -> the zip would be
      # unusable, so we stop here with a clear message and the .config lines that decide it.
      - name: Check export-table format (needed for the WiFi/BT CRC patch)
        run: |
          cd "$WORK/src"
          echo "compiler: $(grep -m1 LINUX_COMPILER out/include/generated/compile.h || true)"
          echo "linker:   $("$WORK/toolchain_611/bin/ld.lld" --version 2>/dev/null | head -1)"
          echo "--- export-table sections (Size / Flg / Al):"
          readelf -S -W out/vmlinux | grep -E 'ksymtab|kcrctab' || true
          echo "--- relevant .config lines:"
          grep -E '^(# )?CONFIG_(HAVE_ARCH_PREL32_RELOCATIONS|MODULE_REL_CRCS|MODVERSIONS|RELOCATABLE|RANDOMIZE_BASE|LTO|THINLTO|CFI|CC_IS_CLANG|CLANG_VERSION|CC_VERSION_TEXT|ARM64_MODULE_PLTS)[= ]' out/.config || true
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(['readelf', '-S', '-W', 'out/vmlinux'], capture_output=True, text=True).stdout
          sz = {}
          for l in out.split('\n'):
              m = re.match(r'\s*\[\s*\d+\]\s+(\S+)\s+\S+\s+[0-9a-f]+\s+[0-9a-f]+\s+([0-9a-f]+)', l)
              if m: sz[m.group(1)] = int(m.group(2), 16)
          bad = False
          for k in ('', '_gpl'):
              ks, kc = sz.get('__ksymtab' + k, 0), sz.get('__kcrctab' + k, 0)
              per = (ks * 4 / kc) if kc else 0   # bytes per ksymtab entry (one 4-byte crc each)
              print(f'__ksymtab{k}: {ks} B, __kcrctab{k}: {kc} B -> {per:.0f} bytes per ksymtab entry (need 8)')
              if kc and ks != 2 * kc: bad = True   # 8-byte entries <=> ksymtab is exactly twice kcrctab
          if bad:
              print('::error::This toolchain/config builds 16-byte export-table entries (stock modules need 8). '
                    'The zip would not load WiFi/BT. Use toolchain=zyc or crdroid11, or send the .config lines above.')
              sys.exit(1)
          print('export-table format OK (8-byte entries)')
          PY

      - name: Show KernelSU-Next driver version
        run: |
          cd "$WORK/src/KernelSU"
          echo "Driver branch/ref: $KSU_REF  commit: $(git rev-parse --short HEAD)  describe: $(git describe --tags 2>/dev/null)"
          echo "Pinned driver version: tag=${KSU_VERSION_TAG_OVERRIDE:-none} code=${KSU_VERSION_OVERRIDE:-none}"
          grep -n "KernelSU-Next version\|KernelSU-Next tag" "$WORK/build.log" | head -4 || true
          grep -rn "KERNEL_SU_UAPI_VERSION" uapi/supercall.h kernel/uapi/supercall.h 2>/dev/null | head -2 || true

      - name: Verify extra features are in the final .config
        run: bash scripts/04_extra_features.sh verify "$WORK/src" "${FEATURES:-bbr}"

      - name: Show errors if build failed
        if: failure()
        run: grep -n "error:\|Error " "$WORK/build.log" | head -40 || true

      - name: Package flashable zip
        run: |
          APK=""
          if [ "$BUNDLE_APK" = "true" ] && [ -f _apk/manager.apk ]; then
            APK="$PWD/_apk/manager.apk"
            echo "Manager APK will be bundled in the zip"
          else
            echo "Manager APK NOT bundled (bundle_apk=$BUNDLE_APK)"
          fi
          bash scripts/03_package.sh "$APK"
          # final name: <toolchain>_<build number>_<original name>, all dashes turned into underscores
          for f in "$OUTDIR"/T225_*.zip; do
            mv "$f" "$OUTDIR/${TOOLCHAIN}_${GITHUB_RUN_NUMBER}_$(basename "$f" | tr '-' '_')"
          done
          ls -l "$OUTDIR"

      # Wi-Fi/BT safety net: every symbol the prebuilt vendor modules (*.ko in Release src-v1) import must
      # be exported by this kernel with the same CRC. Runs on the CRC-patched vmlinux, before anything is published.
      - name: Check vendor Wi-Fi/BT modules resolve against this kernel
        run: |
          mkdir -p _ko
          gh release download src-v1 -R "$GITHUB_REPOSITORY" -p '*.ko' -D _ko --clobber || true
          ls -l _ko
          python3 scripts/check_vendor_syms.py "$WORK/src/out/vmlinux" _ko

      - name: Publish Release
        run: |
          ZIP=$(ls "$OUTDIR"/*.zip)
          gh release create "build-${{ github.run_number }}" "$ZIP" \
            --title "T225 build #${{ github.run_number }} ($KSU_REF | $TOOLCHAIN | $IOSCHED)" \
            --notes "Auto-built flashable zip (toolchain: $TOOLCHAIN). Check after flashing: boots, WiFi/Bluetooth, overclock. Keep a known-good zip for TWRP."

      # Upload the finished zip to Telegram (needs repo secrets TG_BOT_TOKEN and TG_CHAT_ID).
      # Runs only after a successful build; a Telegram problem never fails the build.
      # The caption now carries the real compiler version, kernel version, size, hashes,
      # driver version, commit and build time (Telegram caption limit is 1024 characters).
      - name: Send zip to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::TG_BOT_TOKEN / TG_CHAT_ID secret not set, skipping Telegram upload"; exit 0
          fi
          ZIP=$(ls "$OUTDIR"/*.zip)
          BYTES=$(stat -c%s "$ZIP")
          if [ "$BYTES" -gt 50000000 ]; then
            echo "::warning::zip is $BYTES bytes, over the Telegram bot limit (50 MB), skipping"; exit 0
          fi
          SIZE=$(numfmt --to=iec --suffix=B --format="%.1f" "$BYTES" 2>/dev/null || echo "$BYTES B")
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          SRC="$WORK/src"
          # real compiler that built the kernel (from the kernel's own generated header), short form
          CCFULL=$(sed -n 's/^#define LINUX_COMPILER "\(.*\)"/\1/p' "$SRC/out/include/generated/compile.h" 2>/dev/null | head -1)
          [ -n "$CCFULL" ] || CCFULL=$("$WORK/toolchain_611/bin/clang" --version 2>/dev/null | head -1)
          CC=$(echo "$CCFULL" | grep -oE '([A-Za-z]+ )?clang version [0-9][^ ]*' | head -1)
          [ -n "$CC" ] || CC="$CCFULL"
          KVER=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$SRC/out/include/generated/utsrelease.h" 2>/dev/null | head -1)
          KSUC=$(git -C "$SRC/KernelSU" rev-parse --short HEAD 2>/dev/null || echo "?")
          KSUV="${KSU_VERSION_TAG_OVERRIDE:-?} (${KSU_VERSION_OVERRIDE:-?})"
          SECS=$(( $(date +%s) - ${BUILD_START:-$(date +%s)} ))
          DUR="$(( SECS / 60 ))m $(( SECS % 60 ))s"
          CAPTION=$(printf '%s\n' \
            "✅ T225 build #${{ github.run_number }} OK" \
            "KernelSU-Next: $KSU_REF" \
            "Tarball: ${SRC_ASSET:-?}" \
            "Driver: $KSUV @ $KSUC" \
            "Compiler: $CC" \
            "Toolchain: $TOOLCHAIN | I/O: $IOSCHED" \
            "GPU OC: ${GPU_OC_MHZ:-off} MHz / ${GPU_OC_VOLT:-stock}" \
            "LL OC: ${LITTLE_OC_MHZ:-off} MHz" \
            "zram cap: ${ZRAM_MAX_MB:-off} MB" \
            "Thermal watchdog: ${THERMAL_HOT_C:-off} C" \
            "PPM guard: ${PPM_GUARD:-off}" \
            "Runtime tune: ${RUNTIME_TUNE:-off}" \
            "ZRAM LZ4 dict: ${ZRAM_LZ4_DICT:-off}" \
            "Kernel: ${KVER:-?}" \
            "Features: $FEATURES" \
            "APK bundled: $BUNDLE_APK" \
            "Size: $SIZE | Time: $DUR" \
            "MD5: $MD5" \
            "SHA256: $SHA" \
            "Commit: ${GITHUB_SHA::7}" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ github.run_number }}")
          if curl -sS --retry 3 -o tg_resp.json \
               -F chat_id="$TG_CHAT_ID" -F document=@"$ZIP" -F caption="${CAPTION:0:1000}" \
               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
             && grep -q '"ok":true' tg_resp.json; then
            echo "Telegram upload OK"
          else
            echo "::warning::Telegram upload failed:"; cat tg_resp.json 2>/dev/null || true
          fi

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: _work/build.log

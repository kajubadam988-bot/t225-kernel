name: Build T225 KernelSU-Next kernel

on:
  workflow_dispatch:
    inputs:
      ksu_ref:
        description: "legacy | legacy-susfs | legacy-susfs-nomount | legacy-susfs-manual | legacy-susfs-nomount-manual | susfs-*"
        default: "legacy-susfs-manual"
      manager_apk_url:
        description: "Direct link to the Manager .apk (optional; empty = latest *spoofed* APK from KernelSU-Next releases, else no APK)"
        default: ""
      bundle_apk:
        description: "true = also put the Manager .apk inside the flashable zip (bigger zip). false (default) = not bundled; the APK is still used at build time for the signature and version"
        default: "false"
      toolchain:
        description: "crdroid11 = original working clang 11.0.1 (default, safe) | neutron = latest Neutron Clang | zyc = latest ZyC Clang | slim = latest Slim LLVM (kernel.org) | llvm = upstream LLVM (see llvm_url)  [all except crdroid11 are experimental]"
        default: "crdroid11"
      llvm_url:
        description: "For neutron/zyc/slim/llvm only. Direct link to a Linux x86_64 .tar.xz / .tar.zst / .tar.gz (empty = auto: newest release of the chosen toolchain; llvm = LLVM 23.1.1 official)"
        default: ""
      features:
        description: "Extra kernel features (space separated): bbr | bbrdef | perf | wireguard | none  (bbr = BBR+FQ+FQ_CODEL available; bbrdef = also default cc/qdisc; perf = -O2 + BLK_WBT)"
        default: "bbr bbrdef perf"
      iosched:
        description: "I/O scheduler set at boot: deadline (default, same as before) | kyber | bfq  (bfq also turns on the BFQ kernel option automatically)"
        default: "deadline"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      WORK: ${{ github.workspace }}/_work
      OUTDIR: ${{ github.workspace }}/_out
      GH_TOKEN: ${{ github.token }}
      KSU_REF: ${{ inputs.ksu_ref }}
      APK_URL: ${{ inputs.manager_apk_url }}
      FEATURES: ${{ inputs.features }}
      TOOLCHAIN: ${{ inputs.toolchain }}
      BUNDLE_APK: ${{ inputs.bundle_apk }}
      LLVM_URL: ${{ inputs.llvm_url }}
      IOSCHED: ${{ inputs.iosched }}
    steps:
      - uses: actions/checkout@v4

      - name: Record start time
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download kernel source and build files (Release src-v1)
        run: |
          gh release download src-v1 -R "$GITHUB_REPOSITORY" -p kernel_src.tar.gz -p T225_GitHub_Repo_Files.zip
          unzip -oq T225_GitHub_Repo_Files.zip -x '.github/*'

      # I/O scheduler: patches the boot script in the zip, and adds a 'bfq' feature to
      # 04_extra_features.sh (BFQ is not enabled in the stock T225 defconfig). Kyber is already built in.
      - name: I/O scheduler choice (iosched input)
        run: |
          case "$IOSCHED" in deadline|kyber|bfq) ;; *) echo "::error::iosched must be deadline, kyber or bfq"; exit 1 ;; esac
          python3 - <<'PY'
          p = "scripts/04_extra_features.sh"
          s = open(p).read()
          if "IOSCHED_BFQ" not in s:
              a = "      wireguard) need WIREGUARD ;;\n"
              assert s.count(a) == 1, "verify anchor not found"
              s = s.replace(a, a + "      bfq) need IOSCHED_BFQ; need BFQ_GROUP_IOSCHED ;;\n")
              b = '    *) echo "04: unknown feature'
              assert s.count(b) == 1, "apply anchor not found"
              blk = ("    bfq)\n      need_file block/bfq-iosched.c\n"
                     "      set_y IOSCHED_BFQ; set_y BFQ_GROUP_IOSCHED\n      ;;\n")
              s = s.replace(b, blk + b)
              open(p, "w").write(s)
          PY
          if [ "$IOSCHED" = "bfq" ] && ! echo " $FEATURES " | tr ',' ' ' | grep -q ' bfq '; then
            if [ "$FEATURES" = "none" ]; then NEWF="bfq"; else NEWF="$FEATURES bfq"; fi
            echo "FEATURES=$NEWF" >> "$GITHUB_ENV"
            echo "iosched=bfq -> features: $NEWF"
          fi
          sed -i "s|echo deadline > \"\$q/scheduler\"|echo $IOSCHED > \"\$q/scheduler\"|" ak3_template/ramdisk/sbin/t225-perf-extra.sh
          grep -n 'scheduler' ak3_template/ramdisk/sbin/t225-perf-extra.sh
          grep -q "echo $IOSCHED > " ak3_template/ramdisk/sbin/t225-perf-extra.sh || { echo "::error::scheduler line not patched"; exit 1; }

      # Experimental: other clang instead of the crDroid clang 11.0.1.
      # It is unpacked to $WORK/toolchain_611, so 01_setup.sh skips its own git clone and
      # 02_build.sh picks it up unchanged. Extra -Wno flags are added because a new clang is
      # much stricter than clang 11 on this old 4.19 vendor code. Default (crdroid11) is untouched.
      - name: Install experimental toolchain (neutron | zyc | slim | llvm)
        if: inputs.toolchain != 'crdroid11'
        run: |
          URL="$LLVM_URL"
          if [ -z "$URL" ]; then
            case "$TOOLCHAIN" in
              neutron)
                # newest Neutron Clang build (asset neutron-clang-<date>.tar.zst)
                URL=$(gh api repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
                  --jq '[.assets[] | select(.name | test("^neutron-clang-.*\\.tar\\.zst$"))][0].browser_download_url // empty') ;;
              zyc)
                # ZyC publishes several clang lines (14.0.6, 16.0.6, 21.0.0git ...), and "releases/latest"
                # returns whichever line was uploaded LAST -> random version. So pick the highest
                # version line, newest date inside it (asset Clang-<ver>-<date>.tar.gz, ~570 MB).
                URL=$(gh api "repos/ZyCromerZ/Clang/releases?per_page=100" \
                  --jq '.[] | select(.prerelease==false) | .assets[] | select(.name | test("^Clang-.*\\.tar\\.(gz|xz|zst)$")) | "\(.name) \(.browser_download_url)"' \
                  | python3 -c '
          import re, sys
          best = None
          for l in sys.stdin:
              n, u = l.split()
              m = re.match(r"Clang-(.+)-(\d{8})\.tar", n)
              if not m: continue
              ver = tuple(int(x) for x in re.findall(r"\d+", m.group(1))[:3])
              key = (ver, int(m.group(2)))
              if best is None or key > best[0]: best = (key, u)
          print(best[1] if best else "")
          ') ;;
              slim)
                # newest stable (non -rc) Slim LLVM from kernel.org
                BASE="https://mirrors.edge.kernel.org/pub/tools/llvm/files"
                F=$(curl -fsSL --retry 3 "$BASE/" | grep -oE 'llvm-[0-9]+\.[0-9]+\.[0-9]+-x86_64\.tar\.xz' | sort -uV | tail -1)
                [ -n "$F" ] && URL="$BASE/$F" ;;
              *)
                URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.1/LLVM-23.1.1-Linux-X64.tar.xz" ;;
            esac
            [ -z "$URL" ] && { echo "::error::could not resolve the $TOOLCHAIN toolchain download"; exit 1; }
          fi
          echo "Toolchain ($TOOLCHAIN): $URL"
          sudo apt-get install -y zstd >/dev/null 2>&1 || true
          mkdir -p _llvm "$WORK"
          curl -fL --retry 3 -o _llvm/tc.archive "$URL"
          case "$URL" in
            *.zst) tar -C _llvm --zstd -xf _llvm/tc.archive ;;
            *.gz)  tar -C _llvm -xzf _llvm/tc.archive ;;
            *)     tar -C _llvm -xf _llvm/tc.archive ;;
          esac
          rm -f _llvm/tc.archive
          # bin/clang is a symlink (-> clang-23) in the official tarball, so accept files AND symlinks
          CLANG=$(find _llvm \( -type f -o -type l \) -path '*/bin/clang' | head -1)
          if [ -z "$CLANG" ]; then
            echo "::error::bin/clang not found in the archive. Top-level content:"
            ls -la _llvm | head -20
            exit 1
          fi
          rm -rf "$WORK/toolchain_611"
          mv "$(dirname "$(dirname "$CLANG")")" "$WORK/toolchain_611"
          rm -rf _llvm
          "$WORK/toolchain_611/bin/clang" --version | head -1
          python3 - <<'PY'
          p = "scripts/02_build.sh"
          s = open(p).read()
          flags = ('KCFLAGS="-w -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion '
                   '-Wno-incompatible-function-pointer-types -Wno-implicit-int '
                   '-Wno-deprecated-non-prototype -Wno-strict-prototypes"')
          assert "KCFLAGS=-w" in s
          open(p, "w").write(s.replace("KCFLAGS=-w", flags, 1))
          PY
          grep -n "KCFLAGS" scripts/02_build.sh

      # Manager APK: the given link, or the newest *spoofed* release APK of KernelSU-Next.
      # The driver is NOT affected: it always comes from KSU_REF. The APK's signing cert is
      # added to the driver's accepted managers (KSU_EXTRA_CERTS) so a newer Manager is accepted.
      - name: Fetch Manager APK (latest spoofed unless a link is given)
        run: |
          mkdir -p _apk
          URL="$APK_URL"
          if [ -z "$URL" ]; then
            URL=$(gh api "repos/KernelSU-Next/KernelSU-Next/releases?per_page=10" \
              --jq '[.[].assets[] | select(.name | test("spoofed.*release\\.apk$"))][0].browser_download_url // empty' || true)
          fi
          if [ -n "$URL" ] && curl -fsSL -o _apk/manager.apk "$URL" && [ -s _apk/manager.apk ]; then
            echo "Manager APK: $URL"
            CERT=$(python3 -I scripts/apk_cert_info.py --extra _apk/manager.apk)
            echo "Manager cert: $CERT"
            echo "KSU_EXTRA_CERTS=$CERT" >> "$GITHUB_ENV"
            # Driver reports the same version as the Manager (e.g. v3.4.2 / 33355) instead of the
            # branch's own tag/commit count (v3.4.0-legacy / 33313). Read from the APK file name.
            NAME=$(basename "${URL%%\?*}")
            if [[ "$NAME" =~ _v([0-9]+\.[0-9]+\.[0-9]+)[^_]*_([0-9]+)-release\.apk$ ]]; then
              echo "KSU_VERSION_TAG_OVERRIDE=v${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
              echo "KSU_VERSION_OVERRIDE=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
              echo "Driver version will be pinned to v${BASH_REMATCH[1]} (${BASH_REMATCH[2]})"
            else
              echo "::warning::Could not read version from APK name '$NAME'; driver keeps its own version"
            fi
          else
            rm -f _apk/manager.apk
            echo "::warning::No Manager APK fetched; the zip is built without it"
          fi

      - name: Setup (deps, toolchain, source, KernelSU-Next)
        run: bash scripts/01_setup.sh "$KSU_REF"

      - name: Build kernel
        run: |
          bash scripts/02_build.sh
          tail -n 3 "$WORK/build.log"
          grep -q 'BUILD_EXIT=0' "$WORK/build.log"

      # Right after the build: show which compiler/config was used and check the export-table
      # format. The WiFi/BT CRC patch in the packaging step needs 8-byte __ksymtab entries (one 4-byte
      # __kcrctab entry each). Some toolchains/options produce 16-byte entries -> the zip would be
      # unusable, so we stop here with a clear message and the .config lines that decide it.
      - name: Check export-table format (needed for the WiFi/BT CRC patch)
        run: |
          cd "$WORK/src"
          echo "compiler: $(grep -m1 LINUX_COMPILER out/include/generated/compile.h || true)"
          echo "linker:   $("$WORK/toolchain_611/bin/ld.lld" --version 2>/dev/null | head -1)"
          echo "--- export-table sections (Size / Flg / Al):"
          readelf -S -W out/vmlinux | grep -E 'ksymtab|kcrctab' || true
          echo "--- relevant .config lines:"
          grep -E '^(# )?CONFIG_(HAVE_ARCH_PREL32_RELOCATIONS|MODULE_REL_CRCS|MODVERSIONS|RELOCATABLE|RANDOMIZE_BASE|LTO|THINLTO|CFI|CC_IS_CLANG|CLANG_VERSION|CC_VERSION_TEXT|ARM64_MODULE_PLTS)[= ]' out/.config || true
          python3 - <<'PY'
          import re, subprocess, sys
          out = subprocess.run(['readelf', '-S', '-W', 'out/vmlinux'], capture_output=True, text=True).stdout
          sz = {}
          for l in out.split('\n'):
              m = re.match(r'\s*\[\s*\d+\]\s+(\S+)\s+\S+\s+[0-9a-f]+\s+[0-9a-f]+\s+([0-9a-f]+)', l)
              if m: sz[m.group(1)] = int(m.group(2), 16)
          bad = False
          for k in ('', '_gpl'):
              ks, kc = sz.get('__ksymtab' + k, 0), sz.get('__kcrctab' + k, 0)
              per = (ks * 4 / kc) if kc else 0   # bytes per ksymtab entry (one 4-byte crc each)
              print(f'__ksymtab{k}: {ks} B, __kcrctab{k}: {kc} B -> {per:.0f} bytes per ksymtab entry (need 8)')
              if kc and ks != 2 * kc: bad = True   # 8-byte entries <=> ksymtab is exactly twice kcrctab
          if bad:
              print('::error::This toolchain/config builds 16-byte export-table entries (stock modules need 8). '
                    'The zip would not load WiFi/BT. Use toolchain=zyc or crdroid11, or send the .config lines above.')
              sys.exit(1)
          print('export-table format OK (8-byte entries)')
          PY

      - name: Show KernelSU-Next driver version
        run: |
          cd "$WORK/src/KernelSU"
          echo "Driver branch/ref: $KSU_REF  commit: $(git rev-parse --short HEAD)  describe: $(git describe --tags 2>/dev/null)"
          echo "Pinned driver version: tag=${KSU_VERSION_TAG_OVERRIDE:-none} code=${KSU_VERSION_OVERRIDE:-none}"
          grep -n "KernelSU-Next version\|KernelSU-Next tag" "$WORK/build.log" | head -4 || true
          grep -rn "KERNEL_SU_UAPI_VERSION" uapi/supercall.h kernel/uapi/supercall.h 2>/dev/null | head -2 || true

      - name: Verify extra features are in the final .config
        run: bash scripts/04_extra_features.sh verify "$WORK/src" "${FEATURES:-bbr}"

      - name: Show errors if build failed
        if: failure()
        run: grep -n "error:\|Error " "$WORK/build.log" | head -40 || true

      - name: Package flashable zip
        run: |
          APK=""
          if [ "$BUNDLE_APK" = "true" ] && [ -f _apk/manager.apk ]; then
            APK="$PWD/_apk/manager.apk"
            echo "Manager APK will be bundled in the zip"
          else
            echo "Manager APK NOT bundled (bundle_apk=$BUNDLE_APK)"
          fi
          bash scripts/03_package.sh "$APK"
          for f in "$OUTDIR"/T225_*.zip; do
            mv "$f" "$OUTDIR/${TOOLCHAIN}-$(basename "$f")"
          done
          ls -l "$OUTDIR"

      - name: Publish Release
        run: |
          ZIP=$(ls "$OUTDIR"/*.zip)
          gh release create "build-${{ github.run_number }}" "$ZIP" \
            --title "T225 build #${{ github.run_number }} ($KSU_REF | $TOOLCHAIN | $IOSCHED)" \
            --notes "Auto-built flashable zip (toolchain: $TOOLCHAIN). Check after flashing: boots, WiFi/Bluetooth, overclock. Keep a known-good zip for TWRP."

      # Upload the finished zip to Telegram (needs repo secrets TG_BOT_TOKEN and TG_CHAT_ID).
      # Runs only after a successful build; a Telegram problem never fails the build.
      # The caption now carries the real compiler version, kernel version, size, hashes,
      # driver version, commit and build time (Telegram caption limit is 1024 characters).
      - name: Send zip to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::TG_BOT_TOKEN / TG_CHAT_ID secret not set, skipping Telegram upload"; exit 0
          fi
          ZIP=$(ls "$OUTDIR"/*.zip)
          BYTES=$(stat -c%s "$ZIP")
          if [ "$BYTES" -gt 50000000 ]; then
            echo "::warning::zip is $BYTES bytes, over the Telegram bot limit (50 MB), skipping"; exit 0
          fi
          SIZE=$(numfmt --to=iec --suffix=B --format="%.1f" "$BYTES" 2>/dev/null || echo "$BYTES B")
          MD5=$(md5sum "$ZIP" | cut -d' ' -f1)
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          SRC="$WORK/src"
          # real compiler that built the kernel (from the kernel's own generated header), short form
          CCFULL=$(sed -n 's/^#define LINUX_COMPILER "\(.*\)"/\1/p' "$SRC/out/include/generated/compile.h" 2>/dev/null | head -1)
          [ -n "$CCFULL" ] || CCFULL=$("$WORK/toolchain_611/bin/clang" --version 2>/dev/null | head -1)
          CC=$(echo "$CCFULL" | grep -oE '([A-Za-z]+ )?clang version [0-9][^ ]*' | head -1)
          [ -n "$CC" ] || CC="$CCFULL"
          KVER=$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$SRC/out/include/generated/utsrelease.h" 2>/dev/null | head -1)
          KSUC=$(git -C "$SRC/KernelSU" rev-parse --short HEAD 2>/dev/null || echo "?")
          KSUV="${KSU_VERSION_TAG_OVERRIDE:-?} (${KSU_VERSION_OVERRIDE:-?})"
          SECS=$(( $(date +%s) - ${BUILD_START:-$(date +%s)} ))
          DUR="$(( SECS / 60 ))m $(( SECS % 60 ))s"
          CAPTION=$(printf '%s\n' \
            "✅ T225 build #${{ github.run_number }} OK" \
            "KernelSU-Next: $KSU_REF" \
            "Driver: $KSUV @ $KSUC" \
            "Compiler: $CC" \
            "Toolchain: $TOOLCHAIN | I/O: $IOSCHED" \
            "Kernel: ${KVER:-?}" \
            "Features: $FEATURES" \
            "APK bundled: $BUNDLE_APK" \
            "Size: $SIZE | Time: $DUR" \
            "MD5: $MD5" \
            "SHA256: $SHA" \
            "Commit: ${GITHUB_SHA::7}" \
            "${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ github.run_number }}")
          if curl -sS --retry 3 -o tg_resp.json \
               -F chat_id="$TG_CHAT_ID" -F document=@"$ZIP" -F caption="${CAPTION:0:1000}" \
               "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
             && grep -q '"ok":true' tg_resp.json; then
            echo "Telegram upload OK"
          else
            echo "::warning::Telegram upload failed:"; cat tg_resp.json 2>/dev/null || true
          fi

      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: _work/build.log

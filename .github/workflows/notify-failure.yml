name: Send failed build log to Telegram

# Runs after "Build T225 KernelSU-Next kernel" has FINISHED with a failure.
# At that point GitHub has the complete "Download log archive" zip (every step), which
# cannot be fetched from inside the failing run itself. It is sent to Telegram as a file.
# Needs repo secrets TG_BOT_TOKEN and TG_CHAT_ID (same ones the build uses).

on:
  workflow_run:
    workflows: ["Build T225 KernelSU-Next kernel"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  send-log:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_NUM: ${{ github.event.workflow_run.run_number }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Download log archive and send to Telegram
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::TG_BOT_TOKEN / TG_CHAT_ID not set, skipping"; exit 0
          fi
          # which step failed
          FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' || true)
          CAPTION=$(printf '%s\n' \
            "❌ T225 build #${RUN_NUM} FAILED" \
            "Failed step: ${FAILED:-?}" \
            "Branch: ${BRANCH}" \
            "Full log archive attached (all steps)." \
            "${RUN_URL}")
          if gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/logs" > "logs_${RUN_NUM}.zip" \
             && [ -s "logs_${RUN_NUM}.zip" ] \
             && [ "$(stat -c%s "logs_${RUN_NUM}.zip")" -le 49000000 ]; then
            curl -sS --retry 3 \
              -F chat_id="$TG_CHAT_ID" \
              -F document=@"logs_${RUN_NUM}.zip" \
              -F caption="${CAPTION:0:1000}" \
              "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
          else
            echo "::warning::log archive missing or over 49 MB, sending text only"
            curl -sS --retry 3 "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -d chat_id="$TG_CHAT_ID" --data-urlencode "text=${CAPTION}"
          fi
